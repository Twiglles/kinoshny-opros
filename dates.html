<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Twiglles Киношная — когда смотрим?</title>
  <meta name="description" content="Отметь дни и время, когда тебе удобно прийти на просмотр">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="dates.css">
</head>
<body class="dates-page">
  <main class="wall">
    <header class="wall-head">
      <div class="brand">Twiglles Киношная</div>
      <nav class="switch" aria-label="Разделы">
        <a href="./">Что смотрим?</a>
        <a href="dates.html" aria-current="page">Когда смотрим?</a>
      </nav>
      <p class="lead">Нажми на день и выбери в списке, во сколько тебе удобно. Отметь все дни, которые подходят: выберем тот, что удобен большинству.</p>
      <div id="mode-note" class="mode-note" hidden></div>
    </header>

    <div class="wall-bar">
      <h2 class="month-title" id="month-title"></h2>
      <label class="who">
        <span class="who-label">Как тебя зовут?</span>
        <input id="name" maxlength="60" placeholder="можно не писать" autocomplete="nickname">
      </label>
      <div class="save" role="status" aria-live="polite">
        <span class="live-dot" id="live-dot"></span>
        <span id="save-text">Отметь хотя бы один день</span>
        <button type="button" class="link-btn" id="clear" hidden>Сбросить</button>
      </div>
    </div>

    <section id="board" class="board-cal" aria-label="Календарь"></section>
  </main>

  <script src="config.js"></script>
  <script src="dates-common.js"></script>
  <script src="dates.js"></script>
</body>
</html>
